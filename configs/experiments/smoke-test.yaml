extends: base.yaml

metadata:
  name: smoke-test
  description: Fast end-to-end sanity check for CI and local validation.

run:
  num_envs: 1
  base_seed: 13

environment:
  n_decks: 1
  shoe_penetration: 1.0
  observation:
    profile: minimal_basic_strategy

model:
  architecture: feedforward
  encoder_profile: minimal_basic_strategy
  activation: relu
  use_layer_norm: false
  dropout: 0.0
  feedforward_hidden_dims: [128, 128]
  use_phase_adapters: true
  use_module_gating: true

training:
  trainer:
    total_epochs: 1
    env_steps_per_epoch: 18
    train_frequency: 1
    updates_per_train_step: 1
    max_updates_per_epoch: 4
    device: cpu
    seed: 13
    reset_hidden_on_round_end: false
    sequence_end_on_done: false
    flush_partial_sequences_at_epoch_end: true
    loss:
      gamma: 0.99
      loss_type: huber
      validate_current_actions: true
      validate_next_action_mask: true
      allow_terminal_without_legal_next_action: true
      phase_weights:
        enabled: true
        betting_weight: 1.5
        playing_weight: 1.0
  replay_buffer:
    capacity: 256
    batch_size: 4
    warmup_size: 8
    sequence_length: 8
    min_sequence_length: 2
  n_step:
    enabled: false
    n_steps: 3
  epsilon:
    betting:
      start: 0.8
      end: 0.1
      decay_steps: 50
      evaluation_epsilon: 0.0
    playing:
      start: 0.8
      end: 0.1
      decay_steps: 50
      evaluation_epsilon: 0.0
  evaluation:
    enabled: true
    every_n_epochs: 1
    num_rounds: 4
    max_decisions: 200
  checkpoints:
    directory: outputs/smoke-test
    save_latest: true
    save_best_eval: true
    save_periodic: true
    periodic_interval_updates: 2
  prints:
    enable: false
    print_run_summary: true
    print_warmup_interval: 200
    print_update_interval: 50
    print_collection_interval: 100
    print_epoch_header: true
    print_epoch_summary: true
    print_eval_summary: true
    include_segment_details: false
