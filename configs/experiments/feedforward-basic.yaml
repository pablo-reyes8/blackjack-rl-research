extends: base.yaml

metadata:
  name: feedforward-basic
  description: Feedforward Double DQN on a compact observation space close to basic strategy inputs.

run:
  num_envs: 4

environment:
  observation:
    profile: minimal_basic_strategy

model:
  architecture: feedforward
  encoder_profile: minimal_basic_strategy
  activation: relu
  use_layer_norm: false
  dropout: 0.0
  feedforward_hidden_dims: [256, 256]
  use_phase_adapters: true
  use_module_gating: true

training:
  trainer:
    total_epochs: 5
    env_steps_per_epoch: 512
    train_frequency: 1
    updates_per_train_step: 1
    seed: 21
  replay_buffer:
    batch_size: 64
    warmup_size: 128
  checkpoints:
    directory: outputs/feedforward-basic
    periodic_interval_updates: 100
